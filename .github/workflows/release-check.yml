name: Runtime release checks

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  repository:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer and launch scripts
        shell: pwsh
        run: |
          foreach ($name in @('install.ps1', 'update.ps1', 'Start-AutoClip.ps1', '.github/tests/Update.Tests.ps1', '.github/tests/InstallRetry.Tests.ps1', '.github/tests/GpuRuntime.Tests.ps1', '.github/tests/ReleasePin.Tests.ps1', '.github/tests/ReleaseDownload.Tests.ps1', '.github/scripts/verify-public-release.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $name), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "$name has PowerShell syntax errors: $errors" }
          }
          if (-not (Select-String -LiteralPath LICENSE -SimpleMatch 'Copyright (c) 2026 Jad Ghazi')) {
            throw 'The upstream copyright notice is missing.'
          }
      - name: Release pin regression cases
        shell: pwsh
        run: ./.github/tests/ReleasePin.Tests.ps1
      - name: Reject unsupported platform
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          try {
            & ./install.ps1
            throw 'Installer incorrectly accepted a non-Windows platform.'
          } catch {
            if ($_.Exception.Message -notlike '*Windows x64 Python wheels*') { throw }
          }

  public-installer-pin:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect installer pin change
        id: pin
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { $env:PUSH_BEFORE }
          if (-not $base -or $base -match '^0+$') {
            $changed = $true
          } else {
            $files = @(git diff --name-only $base HEAD -- install.ps1)
            if ($LASTEXITCODE -ne 0) { throw 'Could not compare installer pin with the base commit.' }
            $changed = $files.Count -gt 0
          }
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Verify exact public installer asset
        if: steps.pin.outputs.changed == 'true'
        shell: pwsh
        run: ./.github/scripts/verify-public-release.ps1

  windows-release-smoke:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Interrupted download removes the temporary archive
        shell: pwsh
        run: |
          function Invoke-WebRequest {
            param($Uri, $OutFile)
            [IO.File]::WriteAllText($OutFile, 'interrupted download')
            throw 'simulated download interruption'
          }
          $archive = Join-Path ([IO.Path]::GetTempPath()) "autoclip-v11-gpu-runtime-$PID.zip"
          try {
            & ./install.ps1 -InstallRoot (Join-Path $env:RUNNER_TEMP 'interrupted-download-check')
            throw 'Installer unexpectedly succeeded.'
          } catch {
            if ($_.Exception.Message -notlike '*simulated download interruption*') { throw }
          }
          if (Test-Path -LiteralPath $archive) { throw 'Partial archive was not removed.' }
      - name: Missing release keeps previous selection
        shell: pwsh
        run: ./.github/tests/ReleaseDownload.Tests.ps1
      - name: Download, verify and install published asset
        shell: pwsh
        env:
          UV_PYTHON_DOWNLOADS: never
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}\empty-managed-python
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'autoclip-windows-py311-v11-gpu-runtime.zip'
          Invoke-WebRequest -UseBasicParsing -Uri (& ./install.ps1 -ReleaseInfo).ArchiveUrl -OutFile $archive
          ./install.ps1 -InstallRoot (Join-Path $env:RUNNER_TEMP 'AutoClip\v11-gpu-runtime') -ArchivePath $archive
      - name: Verify packaged CUDA runtime and loader discovery
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'autoclip-windows-py311-v11-gpu-runtime.zip'
          & ./.github/tests/GpuRuntime.Tests.ps1 -ReleaseArchive $archive -InstalledRoot (Join-Path $env:RUNNER_TEMP 'AutoClip\v11-gpu-runtime')
          $python = Join-Path $env:RUNNER_TEMP 'AutoClip\v11-gpu-runtime\.venv\Scripts\python.exe'
          & uv pip check --python $python
          if ($LASTEXITCODE -ne 0) { throw 'Installed dependency check failed.' }
      - name: Check interrupted install retry
        shell: pwsh
        run: ./.github/tests/InstallRetry.Tests.ps1 -InstalledRoot (Join-Path $env:RUNNER_TEMP 'AutoClip\v11-gpu-runtime')
      - name: Update, rollback and failure recovery
        shell: pwsh
        run: ./.github/tests/Update.Tests.ps1 -BaseRoot (Join-Path $env:RUNNER_TEMP 'AutoClip')
      - name: Start packaged app and check health/home
        shell: pwsh
        run: |
          $env:AUTOCLIP_HOME = Join-Path $env:RUNNER_TEMP 'autoclip-home'
          $python = Join-Path $env:RUNNER_TEMP 'AutoClip\v11-gpu-runtime\.venv\Scripts\python.exe'
          & $python -c "from fastapi.testclient import TestClient; from autoclip.app import create_app; c=TestClient(create_app()); c.__enter__(); assert c.get('/api/health').status_code == 200; assert c.get('/').status_code == 200; c.__exit__(None,None,None)"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged health/home smoke failed.' }
